*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(circle, var(--spark) 1px, transparent 1.6px) 0 0/28px 28px,
    radial-gradient(circle, var(--spark) 1px, transparent 1.6px) 14px 14px/28px 28px,
    linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 46%, var(--bg-bot) 100%);
  background-color:var(--bg-mid);
  color:var(--on-bg); font-family:var(--font); font-size:14px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button,input,label{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink-lo);outline-offset:2px}
img{max-width:100%}
.app{max-width:1080px;margin:0 auto;padding:14px 14px 40px}

/* top bar */
.bar{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;margin-bottom:14px;min-height:44px}
.bar .mid{justify-self:center}
.sq{width:44px;height:40px;border:2px solid var(--line);background:var(--pink);color:var(--on-pink);
  box-shadow:inset 2px 2px 0 var(--pink-hi), inset -2px -2px 0 var(--pink-lo), 0 3px 0 var(--line);
  display:grid;place-items:center;padding:0}
.sq:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 var(--pink-hi), inset -2px -2px 0 var(--pink-lo), 0 1px 0 var(--line)}
.sq svg{width:22px;height:22px;image-rendering:pixelated}
.pill{font-family:var(--font-b);font-size:24px;line-height:1;padding:8px 22px 9px;border:2px solid var(--line);border-radius:999px;
  background:var(--pink);color:var(--on-pink);box-shadow:inset 0 2px 0 var(--pink-hi), inset 0 -3px 0 var(--pink-lo);letter-spacing:.04em;white-space:nowrap}
.btn{font-family:var(--font-b);font-size:12px;letter-spacing:.06em;padding:8px 14px;border:2px solid var(--line);background:var(--pink);color:var(--on-pink);
  box-shadow:inset 2px 2px 0 var(--pink-hi), inset -2px -2px 0 var(--pink-lo), 0 3px 0 var(--line);min-height:38px}
.btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 var(--pink-hi), inset -2px -2px 0 var(--pink-lo), 0 1px 0 var(--line)}
.btn.grey{background:var(--cell);color:var(--text);box-shadow:inset 2px 2px 0 var(--cell-hi), inset -2px -2px 0 var(--cell-lo), 0 3px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.on{background:var(--pink-lo);color:#fff}

/* tabs (상의 / 하의) */
.tabs{display:flex;gap:10px;justify-content:center;margin:0 0 12px}
.tab{color:var(--text);min-width:92px;padding:6px 14px;border:2px solid var(--line);background:var(--cell);font-size:14px;
  box-shadow:inset 2px 2px 0 var(--cell-hi), inset -2px -2px 0 var(--cell-lo)}
.tab[aria-pressed="true"]{background:var(--pink);color:var(--on-pink);box-shadow:inset 2px 2px 0 var(--pink-hi), inset -2px -2px 0 var(--pink-lo)}

/* item grid */
.shelf{display:grid;grid-template-columns:32px 1fr 32px;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);border:3px solid var(--line);background:var(--line);gap:3px}
.cell{aspect-ratio:1;background:var(--cell);border:0;padding:6px;position:relative;
  box-shadow:inset 3px 3px 0 var(--cell-hi), inset -3px -3px 0 var(--cell-lo);display:grid;place-items:center;min-width:0}
.cell img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.cell[aria-pressed="true"]{background:var(--sel);box-shadow:inset 3px 3px 0 var(--sel-hi), inset -3px -3px 0 var(--sel-lo)}
.cell.empty{cursor:default}
.cell .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border:2px solid var(--line);background:#fff;color:#2A2533;
  font-size:12px;line-height:14px;display:none}
.deleting .cell:not(.empty) .x{display:block}
.deleting .cell:not(.empty){animation:wob .35s steps(2) infinite alternate}
@keyframes wob{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){.deleting .cell:not(.empty){animation:none}}
.arrow{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--cell-hi);padding:0;display:grid;place-items:center}
.arrow::before{content:"";border:7px solid transparent;border-left:10px solid var(--line);margin-left:9px}
.arrow.prev::before{border-left:7px solid transparent;border-right:10px solid var(--line);margin-left:0;margin-right:9px}
.arrow[disabled]{opacity:.3;cursor:default}
.pager{text-align:center;font-size:12px;color:var(--muted-bg);margin-top:6px;min-height:18px}
.box{border:3px solid var(--line);background:var(--paper);color:var(--text);padding:12px}
.empty-note{text-align:center;color:var(--on-bg);margin:14px auto 0;max-width:34ch}

/* screens */
.screen{display:none}
.screen.active{display:block}

/* home */
.home{display:grid;justify-items:center;text-align:center;padding-top:6vh;gap:14px}
.logo{font-family:var(--font-b);font-size:48px;line-height:1.15;margin:0;letter-spacing:.03em;color:transparent;
  background:linear-gradient(90deg, #FFB8E0, #B4E2FF, #D4BCFF, #FFEFA3, #B2F0D5, #FFB8E0) 0 0/400% 100%;
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(3px 3px 0 var(--pink)) drop-shadow(3px 3px 0 var(--line));
  animation:holo 9s linear infinite}
.logo span{color:transparent;
  background:linear-gradient(115deg, transparent 42%, #fff 47%, #fff 53%, transparent 58%) 120% 0/300% 100% no-repeat;
  -webkit-background-clip:text;background-clip:text;animation:shine 4.5s steps(16) infinite}
@keyframes holo{to{background-position:400% 0}}
@keyframes shine{0%{background-position:120% 0}55%,100%{background-position:-20% 0}}
@media (prefers-reduced-motion:reduce){.logo,.logo span{animation:none}}
.home p{margin:0;color:var(--muted-bg)}
.hanger{width:132px;height:auto;image-rendering:pixelated}
.home-menu{display:grid;gap:14px;width:min(320px,100%);margin-top:10px}

.home-menu small{display:block;font-family:var(--font);font-size:12px;letter-spacing:0;opacity:.8;margin-top:2px}
.mode{font-size:12px;color:var(--muted-bg);margin-top:8px}

/* wardrobe */
.ward{max-width:560px;margin:0 auto}
.tools{display:flex;justify-content:center;gap:12px;margin-top:14px}
.round{color:var(--text);width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--cell-hi);font-size:20px;line-height:1;padding:0;display:grid;place-items:center}
.round.on{background:var(--sel)}
.round svg{width:20px;height:20px}

/* add */
.add{max-width:620px;margin:0 auto}
.compare{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:6px}
.frame{color:var(--text);aspect-ratio:3/4;border:3px solid var(--line);background:var(--cell);
  box-shadow:inset 3px 3px 0 var(--cell-hi), inset -3px -3px 0 var(--cell-lo);display:grid;place-items:center;overflow:hidden;position:relative;padding:8px}
.frame img{width:100%;height:100%;object-fit:contain}
.frame.result{background:var(--stage)}
.drop{border-style:dashed;cursor:pointer;text-align:center;font-size:14px;padding:16px}
.drop.over{background:var(--sel-hi)}
.frame .busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--cell) 80%,transparent);font-size:14px}
.big-arrow{width:40px;height:12px;background:var(--line);position:relative;justify-self:center}
.big-arrow::after{content:"";position:absolute;right:-10px;top:-8px;border:14px solid transparent;border-left:14px solid var(--line);border-right:0}
.ctrl{display:grid;gap:10px;margin-top:14px}
.ctrl label{display:flex;align-items:center;gap:10px;font-size:13px}
.ctrl input[type=range]{flex:1;accent-color:var(--pink-lo)}
.ctrl .hint{font-size:12px;color:var(--muted-bg);margin:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px;margin-top:10px}
.thumb{color:var(--text);flex:0 0 64px;height:64px;border:2px solid var(--line);background:var(--cell);padding:4px;position:relative}
.thumb[aria-pressed="true"]{background:var(--sel)}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .x{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border:2px solid var(--line);background:#fff;color:#2A2533;font-size:11px;line-height:14px;padding:0}
.thumb.add-more{display:grid;place-items:center;font-size:24px;cursor:pointer}
.savebar{display:flex;justify-content:center;gap:12px;margin-top:16px}
.err{color:var(--warn);font-size:12px;margin:0;text-align:center}

/* match */
.match{display:grid;grid-template-columns:minmax(0,470px) minmax(260px,380px);justify-content:center;gap:28px;align-items:start}
.racks{display:grid;gap:14px}
.rack-label{font-size:12px;color:var(--on-bg);margin:0 0 4px 40px}
.stage-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
.stage{aspect-ratio:3/4;border:3px solid var(--line);background:var(--stage);position:relative;overflow:hidden;
  box-shadow:inset 3px 3px 0 var(--cell-hi), inset -3px -3px 0 var(--cell-lo), 6px 6px 0 var(--line);touch-action:none}
.stage .piece{position:absolute;transform:translateX(-50%);touch-action:none;cursor:grab;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.18))}
.stage .piece.sel{outline:2px dashed var(--pink-lo);outline-offset:2px}
.stage .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:24px;pointer-events:none}
.stage-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.stage-tools .btn{padding:6px 10px;min-height:34px}
@media (max-width:760px){
  .match{grid-template-columns:1fr}
  .stage-col{position:static;max-width:270px;width:100%;margin:0 auto;order:-1}
  .stage-tools{margin-top:12px;gap:6px}
  .logo{font-size:36px}
}

/* lookbook */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.look{color:var(--text);border:3px solid var(--line);background:var(--paper);padding:8px;display:grid;gap:8px}
.look .stage{box-shadow:inset 2px 2px 0 var(--cell-hi), inset -2px -2px 0 var(--cell-lo);border-width:2px;cursor:pointer}
.look .stage .piece{cursor:pointer}
.look-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.look-row button{border:2px solid var(--line);background:var(--cell-hi);font-size:12px;padding:2px 8px}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);
  background:var(--line);color:#fff;padding:10px 16px;border:2px solid var(--pink);font-size:13px;z-index:20;display:none;max-width:90vw;text-align:center}

.toast.show{display:block}
.modal{position:fixed;inset:0;background:rgba(20,16,26,.45);display:none;place-items:center;z-index:30;padding:20px}
.modal.show{display:grid}
.modal .box{max-width:320px;text-align:center;box-shadow:6px 6px 0 var(--line)}
.modal p{margin:4px 0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script>
// Flood-fill background removal tuned for clothes laid flat on a floor / bed / wall.
// Input: Uint8ClampedArray RGBA, w, h, tol (5..80). Output: alpha Uint8ClampedArray (w*h)
function removeBackground(data, w, h, tol) {
  const N = w * h;
  const alpha = new Uint8ClampedArray(N);
  // Already transparent image? keep its own alpha.
  let transparentBorder = 0, borderCount = 0;
  for (let x = 0; x < w; x += 3) { borderCount += 2; if (data[(x) * 4 + 3] < 20) transparentBorder++; if (data[((h - 1) * w + x) * 4 + 3] < 20) transparentBorder++; }
  if (transparentBorder > borderCount * 0.6) { for (let i = 0; i < N; i++) alpha[i] = data[i * 4 + 3]; return alpha; }

  // 1. background palette: k-means (k=5) on border band pixels
  const band = Math.max(2, Math.round(Math.min(w, h) * 0.02));
  const samples = [];
  const step = Math.max(1, Math.round((w + h) / 600));
  const side = []; // 0 top,1 bottom,2 left,3 right
  for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) {
    let sd = -1;
    if (y < band) sd = 0; else if (y >= h - band) sd = 1; else if (x < band) sd = 2; else if (x >= w - band) sd = 3;
    if (sd >= 0) { const i = (y * w + x) * 4; samples.push(data[i], data[i + 1], data[i + 2]); side.push(sd); }
  }
  const S = samples.length / 3, K = Math.min(5, S);
  const cent = [];
  for (let k = 0; k < K; k++) { const j = Math.floor((k + 0.5) / K * S) * 3; cent.push([samples[j], samples[j + 1], samples[j + 2]]); }
  const assign = new Int32Array(S);

  $("#dropText").hidden = !!p; oi.hidden = !p; if (p) oi.src = p.origURL;
  ri.hidden = !(p && p.out); if (p && p.out) ri.src = p.out.url;
  $("#busy").hidden = !(p && p.busy);
  $("#ctrl").hidden = !p;
  if (p) { $("#tol").value = p.tol; $("#tol").disabled = p.keepBg; $("#keepBg").checked = p.keepBg; $("#addErr").textContent = p.err; }
  const strip = $("#strip"); strip.hidden = !S.pending.length; strip.innerHTML = "";
  S.pending.forEach((q, i) => {
    const b = document.createElement("div"); b.className = "thumb"; b.setAttribute("role", "button"); b.tabIndex = 0;
    b.setAttribute("aria-pressed", String(i === S.cur)); b.setAttribute("aria-label", `사진 ${i + 1}`);
    const im = new Image(); im.src = q.out ? q.out.url : q.origURL; im.alt = ""; b.append(im);
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", `사진 ${i + 1} 빼기`);
    x.onclick = ev => { ev.stopPropagation(); S.pending.splice(i, 1); if (S.cur >= S.pending.length) S.cur = S.pending.length - 1; renderAdd(); };
    b.append(x);
    b.onclick = () => { S.cur = i; renderAdd(); };
    b.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); S.cur = i; renderAdd(); } };
    strip.append(b);
  });
  if (S.pending.length) {
    const more = document.createElement("label"); more.className = "thumb add-more"; more.htmlFor = "file"; more.textContent = "+"; more.setAttribute("aria-label", "사진 더 고르기");
    strip.append(more);
  }
  const ready = S.pending.filter(q => q.out).length;
  const sv = $("#addSave"); sv.disabled = !ready || S.pending.some(q => q.busy); sv.textContent = ready ? `저장 (${ready})` : "저장";
}
$$("[data-atab]").forEach(b => b.onclick = () => { const p = S.pending[S.cur]; if (p) p.cat = b.dataset.atab; else S.addCat = b.dataset.atab; renderAdd(); });
$("#file").onchange = e => { const f = e.target.files; ingest(f); e.target.value = ""; };
const drop = $("#drop");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => ingest(e.dataTransfer.files));
drop.addEventListener("click", e => { if (S.pending.length) e.preventDefault(); });
let tolT;
$("#tol").oninput = e => { const p = S.pending[S.cur]; if (!p) return; p.tol = +e.target.value; clearTimeout(tolT); tolT = setTimeout(() => processEntry(p), 200); };
$("#keepBg").onchange = e => { const p = S.pending[S.cur]; if (!p) return; p.keepBg = e.target.checked; processEntry(p); };
$("#addCancel").onclick = () => { S.pending = []; S.cur = -1; go("ward"); };
$("#addSave").onclick = async () => {
  const ready = S.pending.filter(q => q.out);
  const sv = $("#addSave"); sv.disabled = true;
  let done = 0, lastCat = null;
  for (const q of ready) {
    sv.textContent = `저장 중 ${done + 1}/${ready.length}`;
    try {
      const it = await S.store.addItem(q.cat, q.out.blob, q.out.ar);
      S.items.push(it); done++; lastCat = q.cat;
      S.pending.splice(S.pending.indexOf(q), 1);
    } catch (e) { console.warn(e); toast(errMsg(e)); break; }
  }
  S.cur = S.pending.length ? 0 : -1;
  if (done) {
    toast(`옷장에 ${done}벌 넣었어요`);
    if (!S.pending.length) { S.wTab = lastCat; S.wPage = pages(ofCat(lastCat).length) - 1; go("ward"); return; }
  }
  renderAdd();
};

/* ---------- samples (simple drawings so the game works before any photo) ---------- */
const SAMPLE_SVGS = [
  ["top", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210"><defs><pattern id="s" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#f4f1ea"/><rect width="20" height="9" fill="#2d3a5c"/></pattern></defs><path d="M62 14 L86 6 Q100 20 114 6 L138 14 L192 58 L170 92 L148 76 L148 204 L52 204 L52 76 L30 92 L8 58 Z" fill="url(#s)" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M86 6 Q100 20 114 6" fill="none" stroke="#222" stroke-width="3"/></svg>`],
  ["top", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230"><path d="M70 30 Q110 -6 150 30 L196 60 L216 196 L188 200 L172 100 L166 222 L54 222 L48 100 L32 200 L4 196 L24 60 Z" fill="#e48aa8" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M78 34 Q110 70 142 34 Q110 8 78 34Z" fill="#c9668c" stroke="#222" stroke-width="3"/><path d="M76 150 H144 L152 196 H68 Z" fill="none" stroke="#222" stroke-width="3"/><path d="M100 60 V96 M120 60 V96" stroke="#fff" stroke-width="3"/></svg>`],
  ["top", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230"><path d="M72 18 L92 10 L110 26 L128 10 L148 18 L194 50 L214 200 L186 204 L170 96 L168 222 L52 222 L50 96 L34 204 L6 200 L26 50 Z" fill="#9ec3e6" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M92 10 L110 26 L98 40 L84 22 Z M128 10 L110 26 L122 40 L136 22 Z" fill="#dcecf8" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M110 26 V222" stroke="#222" stroke-width="2"/><g fill="#fff" stroke="#222" stroke-width="2"><circle cx="116" cy="60" r="4"/><circle cx="116" cy="100" r="4"/><circle cx="116" cy="140" r="4"/><circle cx="116" cy="180" r="4"/></g></svg>`],
  ["bottom", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240"><path d="M28 8 H132 L150 232 H96 L80 78 L64 232 H10 Z" fill="#3e6aa8" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M28 24 H132" stroke="#222" stroke-width="3"/><path d="M80 24 V70" stroke="#e9c46a" stroke-width="2" stroke-dasharray="5 4"/><path d="M36 40 Q50 52 64 40 M96 40 Q110 52 124 40" fill="none" stroke="#e9c46a" stroke-width="2"/></svg>`],
  ["bottom", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190"><path d="M56 8 H144 L190 180 H10 Z" fill="#8a5a3c" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M56 22 H144" stroke="#222" stroke-width="3"/><g stroke="#5e3b26" stroke-width="2.5"><path d="M70 22 L42 180"/><path d="M86 22 L76 180"/><path d="M100 22 V180"/><path d="M114 22 L124 180"/><path d="M130 22 L158 180"/></g></svg>`],
  ["bottom", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><path d="M38 8 H162 L184 128 L112 134 L100 66 L88 134 L16 128 Z" fill="#26232b" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M38 24 H162" stroke="#555" stroke-width="3"/></svg>`],
];
async function svgToBlob(svg) {
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const vb = svg.match(/viewBox="0 0 (\d+) (\d+)"/); const vw = +vb[1], vh = +vb[2];
  const cv = document.createElement("canvas"); cv.width = 400; cv.height = Math.round(400 * vh / vw);
  cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
  return { blob: await new Promise(r => cv.toBlob(r, "image/png")), ar: cv.height / cv.width };
}
async function addSamples() {
  const btn = $("#sampleBtn"); if (btn) { btn.disabled = true; btn.textContent = "넣는 중…"; }
  try {
    for (const [cat, svg] of SAMPLE_SVGS) { const { blob, ar } = await svgToBlob(svg); S.items.push(await S.store.addItem(cat, blob, ar)); }
    toast("샘플 옷 6벌을 넣었어요. 필요 없으면 휴지통으로 지우세요.");
  } catch (e) { console.warn(e); toast(errMsg(e)); }
  renderWard();
}

/* ---------- match ---------- */
function autoLayout(top, bottom) {
  const R = STAGE_R, t = {};
  if (top && bottom) {
    const aT = top.ar || 1, aB = bottom.ar || 1.2;
    let wT = 0.74, wB = 0.56;
    const hT = wT * aT / R, hB = wB * aB / R, overlap = 0.8;
    const total = overlap * hT + hB, k = Math.min(1, 0.92 / total);
    const y0 = (1 - k * total) / 2;
    t.top = { x: 0.5, y: y0, w: wT * k };
    t.bottom = { x: 0.5, y: y0 + overlap * hT * k, w: wB * k };
  } else if (top) {
    const a = top.ar || 1; const w = Math.min(0.78, 0.8 * R / a); t.top = { x: 0.5, y: (1 - w * a / R) / 2, w };
  } else if (bottom) {
    const a = bottom.ar || 1.2; const w = Math.min(0.6, 0.86 * R / a); t.bottom = { x: 0.5, y: (1 - w * a / R) / 2, w };
  }
  return t;
}
function drawStage(el, o, interactive) {
  el.innerHTML = "";
  const parts = o.tuck ? ["top", "bottom"] : ["bottom", "top"]; // later = in front
  let any = false;
  for (const part of parts) {
    const it = o[part] && byId(o[part]); const tr = o.t && o.t[part];
    if (!it || !tr) continue;
    any = true;
    const img = new Image(); img.src = it.src; img.alt = part === "top" ? "상의" : "하의"; img.draggable = false;
    img.className = "piece" + (interactive && S.m.sel === part ? " sel" : "");
    img.dataset.part = part;
    img.style.left = tr.x * 100 + "%"; img.style.top = tr.y * 100 + "%"; img.style.width = tr.w * 100 + "%";
    if (interactive) img.addEventListener("pointerdown", startDrag);
    el.append(img);
  }
  if (!any && interactive) {
    el.innerHTML = `<div class="ph">${S.items.length ? "왼쪽에서 상의와 하의를 골라 보세요.<br>입힌 옷은 끌어서 옮길 수 있어요." : "옷장이 비어 있어요.<br>옷장에서 옷을 먼저 넣어 주세요."}</div>`;
  }
}
let drag = null;
function startDrag(e) {
  const part = e.currentTarget.dataset.part;
  S.m.sel = part; $$("#stage .piece").forEach(p => p.classList.toggle("sel", p.dataset.part === part));
  const r = $("#stage").getBoundingClientRect(), tr = S.m.t[part];
  drag = { part, el: e.currentTarget, x: e.clientX, y: e.clientY, x0: tr.x, y0: tr.y, rw: r.width, rh: r.height };
  e.currentTarget.setPointerCapture(e.pointerId);
  e.currentTarget.addEventListener("pointermove", moveDrag);
  e.currentTarget.addEventListener("pointerup", endDrag, { once: true });
  e.currentTarget.addEventListener("pointercancel", endDrag, { once: true });
  e.preventDefault();
}
function moveDrag(e) {
  if (!drag) return;
  const tr = S.m.t[drag.part];
  tr.x = Math.min(1, Math.max(0, drag.x0 + (e.clientX - drag.x) / drag.rw));
  tr.y = Math.min(0.95, Math.max(-0.6, drag.y0 + (e.clientY - drag.y) / drag.rh));
  drag.el.style.left = tr.x * 100 + "%"; drag.el.style.top = tr.y * 100 + "%";
}
function endDrag(e) { if (drag) { drag.el.removeEventListener("pointermove", moveDrag); drag = null; } }

function setPiece(part, id) {
  S.m[part] = S.m[part] === id ? null : id;
  if (S.m[part]) S.m.sel = part;
  else if (S.m.sel === part) S.m.sel = part === "top" ? "bottom" : "top";
  S.m.t = autoLayout(byId(S.m.top), byId(S.m.bottom));
  renderMatch();
}
function renderMatch() {
  const tops = ofCat("top"), bots = ofCat("bottom");
  S.m.tPage = Math.min(S.m.tPage, pages(tops.length) - 1);
  S.m.bPage = Math.min(S.m.bPage, pages(bots.length) - 1);
  if (S.m.top && !byId(S.m.top)) S.m.top = null;
  if (S.m.bottom && !byId(S.m.bottom)) S.m.bottom = null;
  if (!S.m.t) S.m.t = autoLayout(byId(S.m.top), byId(S.m.bottom));
  renderGrid($("#tGrid"), tops, S.m.tPage, { selected: S.m.top, onPick: it => setPiece("top", it.id) });
  renderGrid($("#bGrid"), bots, S.m.bPage, { selected: S.m.bottom, onPick: it => setPiece("bottom", it.id) });
  wirePager($("#tPrev"), $("#tNext"), () => S.m.tPage, p => { S.m.tPage = p; renderMatch(); }, tops.length);
  wirePager($("#bPrev"), $("#bNext"), () => S.m.bPage, p => { S.m.bPage = p; renderMatch(); }, bots.length);
  drawStage($("#stage"), S.m, true);
  const tk = $("#tuck"); tk.classList.toggle("on", S.m.tuck); tk.setAttribute("aria-pressed", String(S.m.tuck));
  const has = S.m.top || S.m.bottom;
  ["#szDown", "#szUp", "#relayout", "#clear"].forEach(s => $(s).disabled = !has);
  $("#rand").disabled = !S.items.length;
}
function resize(f) {
  const part = S.m.t[S.m.sel] ? S.m.sel : (S.m.t.top ? "top" : "bottom");
  const tr = S.m.t[part], it = byId(S.m[part]); if (!tr || !it) return;
  const a = it.ar || 1, h0 = tr.w * a / STAGE_R;
  tr.w = Math.min(1.6, Math.max(0.15, tr.w * f));
  tr.y += (h0 - tr.w * a / STAGE_R) / 2;
  S.m.sel = part; drawStage($("#stage"), S.m, true);
}
$("#szDown").onclick = () => resize(1 / 1.08);
$("#szUp").onclick = () => resize(1.08);
$("#relayout").onclick = () => { S.m.t = autoLayout(byId(S.m.top), byId(S.m.bottom)); drawStage($("#stage"), S.m, true); };
$("#tuck").onclick = () => { S.m.tuck = !S.m.tuck; renderMatch(); toast(S.m.tuck ? "상의를 하의 안으로 넣었어요" : "상의를 밖으로 뺐어요"); };
$("#clear").onclick = () => { S.m.top = S.m.bottom = null; S.m.t = {}; renderMatch(); };
$("#rand").onclick = () => {
  const pick = (list, cur) => { if (!list.length) return null; if (list.length === 1) return list[0].id; let x; do { x = list[Math.floor(Math.random() * list.length)].id; } while (x === cur); return x; };
  const tops = ofCat("top"), bots = ofCat("bottom");
  S.m.top = pick(tops, S.m.top); S.m.bottom = pick(bots, S.m.bottom);
  const ti = tops.findIndex(i => i.id === S.m.top), bi = bots.findIndex(i => i.id === S.m.bottom);
  if (ti >= 0) S.m.tPage = Math.floor(ti / PER_PAGE); if (bi >= 0) S.m.bPage = Math.floor(bi / PER_PAGE);
  S.m.t = autoLayout(byId(S.m.top), byId(S.m.bottom)); renderMatch();
};
async function saveOutfit() {
  if (!S.m.top && !S.m.bottom) { toast("먼저 옷을 하나 이상 골라 주세요"); return; }
  const o = { id: "outfit_" + rid(), top: S.m.top, bottom: S.m.bottom, t: JSON.parse(JSON.stringify(S.m.t)), tuck: S.m.tuck, created: Date.now() };
  try { await S.store.addOutfit(o); S.outfits.push(o); toast("룩북에 저장했어요"); }
  catch (e) { console.warn(e); toast(errMsg(e)); }
}

/* ---------- lookbook ---------- */
function renderLooks() {
  const box = $("#looks"); box.innerHTML = "";
  const list = [...S.outfits].sort((a, b) => b.created - a.created);
  for (const o of list) {
    const card = document.createElement("div"); card.className = "look";
    const st = document.createElement("div"); st.className = "stage"; st.setAttribute("role", "button"); st.tabIndex = 0;
    st.setAttribute("aria-label", "이 코디 다시 열기");
    drawStage(st, o, false);
    const open = () => { Object.assign(S.m, { top: o.top, bottom: o.bottom, t: JSON.parse(JSON.stringify(o.t || {})), tuck: !!o.tuck, sel: o.top ? "top" : "bottom" }); go("match"); };
    st.onclick = open; st.onkeydown = e => { if (e.key === "Enter") open(); };
    const row = document.createElement("div"); row.className = "look-row";
    const d = new Date(o.created); row.innerHTML = `<span>${d.getMonth() + 1}월 ${d.getDate()}일</span>`;
    const del = document.createElement("button"); del.textContent = "지우기";
    del.onclick = async () => { if (!(await ask("이 코디를 룩북에서 지울까요?"))) return; try { await S.store.deleteOutfit(o); S.outfits = S.outfits.filter(x => x !== o); renderLooks(); } catch { toast("지우지 못했어요"); } };
    row.append(del); card.append(st, row); box.append(card);
  }
  $("#looksEmpty").innerHTML = list.length ? "" : `<p class="empty-note">아직 저장한 코디가 없어요. MATCH 화면에서 마음에 드는 조합을 SAVE 하면 여기에 모여요.</p>`;
}

/* ---------- boot ---------- */
(async () => {
  const { store, data } = await pickStore();
  S.store = store; S.items = data.items; S.outfits = data.outfits;
  $$("[data-go]").forEach(b => b.disabled = false);
  renderHome();
})();
})();
</script>
